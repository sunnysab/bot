[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot"
version = "0.1.0"
description = "WeChat bot backed by LLM providers"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "jinja2",
    "loguru",
    "python-dotenv",
    "weixin-bot",
]

[tool.uv.sources]
weixin-bot = { path = "../weixin-rs/sdk/python", editable = true }

[dependency-groups]
dev = ["ruff"]

[tool.setuptools]
py-modules = [
    "ai",
    "bot",
    "build_profiles",
    "config",
    "context",
    "describer",
    "main",
    "media",
    "message",
    "necessity",
    "outbound",
    "plugin",
    "profiles",
    "reply_trace",
    "wechat",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
