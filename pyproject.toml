[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot"
version = "0.1.0"
description = "WeChat bot backed by LLM providers"
requires-python = ">=3.14"
dependencies = [
    "openai",
    "jinja2",
    "loguru",
    "weixin-bot",
    "pillow>=12.3.0",
]

[tool.uv.sources]
weixin-bot = { path = "../weixin-rs/sdk/python", editable = true }

[dependency-groups]
dev = ["ruff"]

[tool.setuptools]
py-modules = [
    "ai",
    "admin",
    "bot",
    "build_habits",
    "build_profiles",
    "config",
    "context",
    "describer",
    "emojis",
    "events",
    "focus",
    "habits",
    "images",
    "main",
    "media",
    "message",
    "moments",
    "necessity",
    "outbound",
    "persona",
    "personas",
    "planner",
    "plugin",
    "profiles",
    "replay_memory",
    "reply_trace",
    "runtime",
    "typos",
    "wechat",
    "websearch",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
