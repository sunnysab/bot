<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bot 管理后台</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --fg:#1c1f23; --dim:#8b939c;
    --pending:#9aa4af; --replied:#2f9e6b; --skipped:#d9a825; --warn:#e08a2b;
    --failed:#d9534f; --phone:#4a86c8; --dry:#9b6dd6; --accent:#4a86c8;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       color:var(--fg);background:var(--bg);height:100vh;display:flex;flex-direction:column}
  button,select,input,textarea{font:inherit;color:inherit}
  button{background:#eef1f4;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
  button:hover{background:#e4e9ee}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  header{padding:7px 14px;background:var(--panel);border-bottom:1px solid var(--line);
         display:flex;gap:14px;align-items:center;font-size:13px;flex-wrap:wrap}
  header b{font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--pending);display:inline-block;margin-right:5px}
  .dot.ok{background:var(--replied)} .dot.bad{background:var(--failed)}
  .badge{background:var(--dry);color:#fff;padding:1px 8px;border-radius:10px;font-size:12px}
  main{flex:1;display:flex;min-height:0}
  aside{width:230px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;flex:none}
  .chat{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
  .chat:hover{background:#f0f3f6}
  .chat.on{background:#e8f1fb;box-shadow:inset 3px 0 0 var(--accent)}
  .chat .n{font-weight:600;display:flex;justify-content:space-between;gap:6px}
  .chat .n em{font-style:normal;font-weight:400;font-size:11px;color:var(--dim)}
  .chat .l{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat .tag{font-size:11px;color:var(--dim);margin-right:4px}
  .center{flex:1;display:flex;flex-direction:column;min-width:0}
  .toolbar{padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line);
           display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
  .toolbar .grow{flex:1}
  section{flex:1;overflow:auto;padding:14px 18px;min-width:0}
  .row{display:flex;margin-bottom:12px}
  .row.out{justify-content:flex-end}
  .bubble{max-width:min(660px,78%);background:var(--panel);border:1px solid var(--line);
          border-radius:10px;padding:7px 11px;cursor:pointer}
  .row.out .bubble{background:#e7f3ff;border-color:#cfe4f7}
  .bubble:hover{border-color:var(--accent)}
  .bubble.sel{box-shadow:0 0 0 2px rgba(74,134,200,.35)}
  .who{font-size:12px;color:var(--dim);margin-bottom:2px}
  .body{white-space:pre-wrap;word-break:break-word}
  .meta{margin-top:5px;font-size:12px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{padding:0 7px;border-radius:9px;font-size:11px;color:#fff;background:var(--pending);white-space:nowrap}
  .chip.replied{background:var(--replied)} .chip.skipped{background:var(--skipped)}
  .chip.warn{background:var(--warn)} .chip.failed{background:var(--failed)}
  .chip.phone{background:var(--phone)} .chip.dry_run{background:var(--dry)}
  .detail{font-size:11px;color:var(--dim)}
  .spin{display:inline-block;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .empty{color:var(--dim);text-align:center;margin-top:60px}
  .dry-text{color:var(--dry);font-style:italic}
  .drawer{width:420px;background:var(--panel);border-left:1px solid var(--line);
          overflow:auto;flex:none;padding:12px 14px;font-size:13px}
  .drawer.hide{display:none}
  .drawer h3{margin:14px 0 6px;font-size:13px;color:var(--dim);font-weight:600}
  .drawer h3:first-child{margin-top:0}
  .drawer pre{background:#f7f8fa;border:1px solid var(--line);border-radius:6px;padding:8px;
              white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:280px;overflow:auto;margin:0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
  .kv span:nth-child(odd){color:var(--dim)}
  .close{float:right;cursor:pointer;color:var(--dim)}
  .logline{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:pre-wrap;
           border-bottom:1px solid #f0f2f4;padding:3px 0;word-break:break-all}
  .logline.warn{background:#fffaf0} .logline.err{background:#fdf2f2}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .cfg .cfg-row{display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:12px}
  .cfg .cfg-row span{width:190px;color:var(--dim);flex:none;text-align:right}
  .cfg .cfg-row input[type=text],.cfg .cfg-row input[type=number],.cfg .cfg-row input[type=password]{
    flex:1;min-width:0;padding:3px 7px;border:1px solid var(--line);border-radius:6px}
  .cfg .cfg-row input[type=checkbox]{width:16px;height:16px}
  .cfg-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .cfg textarea{width:100%;min-height:60px;padding:6px;border:1px solid var(--line);border-radius:6px;font:inherit}
  .bar{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:3px}
  .bar span{width:112px;flex:none;color:var(--dim)}
  .bar i{height:10px;background:var(--accent);border-radius:3px;min-width:2px}
  .bar em{font-style:normal;color:var(--dim)}
  .mem{border-bottom:1px solid #f0f2f4;padding:4px 0;font-size:12.5px}
  .mem .detail{font-size:11px}
  .drawer textarea{min-height:170px}
</style>
</head>
<body>
<header>
  <b id="who">…</b>
  <span><span class="dot" id="relaydot"></span><span id="relay">relay</span></span>
  <span id="counts" style="color:var(--dim)"></span>
  <span class="badge" id="drybadge" style="display:none">演习模式</span>
  <button id="drybtn">演习模式</button>
  <span style="margin-left:auto;color:var(--dim)" id="seq"></span>
</header>
<main>
  <aside id="chats"></aside>
  <div class="center">
    <div class="toolbar">
      <b id="cur">未选会话</b>
      <button id="mutebtn" disabled>静音</button>
      <button id="focusbtn" disabled>专注</button>
      <span class="grow"></span>
      <input id="say" placeholder="手动发一条…" style="width:240px;padding:3px 8px;border:1px solid var(--line);border-radius:6px" disabled>
      <button id="sendbtn" disabled>发送</button>
      <button id="drawerbtn">详情</button>
    </div>
    <section id="stream"><div class="empty">左边选一个会话</div></section>
  </div>
  <div class="drawer hide" id="drawer">
    <span class="close" id="drawerclose">✕</span>
    <div class="tabs">
      <button data-tab="trace" class="on">这条消息</button>
      <button data-tab="health">健康</button>
      <button data-tab="log">日志</button>
      <button data-tab="stats">统计</button>
      <button data-tab="assets">资料</button>
      <button data-tab="config">配置</button>
    </div>
    <div id="panel-trace"></div>
    <div id="panel-health" style="display:none"></div>
    <div id="panel-log" style="display:none"></div>
    <div id="panel-stats" style="display:none"></div>
    <div id="panel-assets" style="display:none"></div>
    <div id="panel-config" style="display:none"></div>
  </div>
</main>
<script>
const LABEL = {
  received:'已接收', stale:'积压·只记不回', phone:'手机发的', muted:'已静音',
  unsupported:'类型不处理', gated:'跳过·门控', backoff:'跳过·退避',
  deciding:'决策中', planner_silent:'不发言', planner_failed:'决策调用失败',
  expressing:'生成回复中', express_failed:'表达失败', empty_reply:'回复为空',
  placeholder_blocked:'占位符已拦', queued:'已排队', typing:'输入中',
  sent:'已回复', dry_run:'演习回复', failed:'发送报错'
};
const GROUP = {
  received:'pending', deciding:'pending', expressing:'pending', queued:'pending', typing:'pending',
  sent:'replied', phone:'phone', dry_run:'dry_run',
  stale:'skipped', muted:'skipped', unsupported:'skipped', gated:'skipped', backoff:'skipped',
  planner_silent:'skipped', empty_reply:'skipped', placeholder_blocked:'skipped',
  planner_failed:'warn', express_failed:'failed', failed:'failed'
};
const SPIN = new Set(['deciding','expressing','queued','typing']);
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get = async u => (await fetch(u)).json();
const post = async (u, body) => (await fetch(u, {method:'POST', headers:{'Content-Type':'application/json'},
                                                body: JSON.stringify(body)})).json();

let since = 0, current = null, currentName = '', reloading = false, selected = null;
let chats = [], tab = 'trace';

function chip(status, detail){
  if(!status) return '';
  const spin = SPIN.has(status) ? '<span class="spin">◌</span> ' : '';
  return `<span class="chip ${GROUP[status]||''}">${spin}${LABEL[status]||status}</span>`
       + (detail ? `<span class="detail">${esc(detail)}</span>` : '');
}

function row(r){
  const m = r.reply_status ? `<div class="meta" data-reply="${r.msg_id}">${chip(r.reply_status, r.reply_detail)}</div>` : '';
  const dry = r.dry_text ? `<div class="body dry-text">${esc(r.dry_text)}</div>` : '';
  const t = new Date(r.ts*1000).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  return `<div class="row ${r.outgoing?'out':''}" data-id="${r.msg_id}">
    <div class="bubble" onclick="pick('${r.msg_id}')">
      <div class="who">${esc(r.sender)} · ${t}</div>
      <div class="body">${esc(r.text)}</div>${dry}
      <div class="meta" data-own="${r.msg_id}">${chip(r.status, r.status_detail)}</div>
      ${m}
    </div></div>`;
}

async function loadChats(){
  ({chats} = await get('/api/chats'));
  $('#chats').innerHTML = chats.map(c =>
    `<div class="chat ${c.chat_id===current?'on':''}" data-chat="${esc(c.chat_id)}">
       <div class="n">${esc(c.name)}<em>${c.count||''}</em></div>
       <div class="l">${c.muted?'<span class="tag">🔇静音</span>':''}${c.focus?'<span class="tag">🎯专注</span>':''}${esc(c.last)}</div>
     </div>`).join('') || '<div class="empty">没有会话</div>';
  document.querySelectorAll('.chat').forEach(el => el.onclick = () => {
    current = el.dataset.chat; selected = null;
    const found = chats.find(c => c.chat_id === current);
    currentName = found ? found.name : current;
    $('#cur').textContent = currentName;
    for (const id of ['mutebtn','focusbtn','say','sendbtn']) $('#'+id).disabled = false;
    $('#mutebtn').classList.toggle('on', !!(found && found.muted));
    $('#focusbtn').classList.toggle('on', !!(found && found.focus));
    loadChats(); loadMessages(); showPanel();
  });
}

async function loadMessages(){
  if(!current) return;
  reloading = true;
  const {messages} = await get(`/api/messages?chat=${encodeURIComponent(current)}&limit=300`);
  $('#stream').innerHTML = messages.length ? messages.map(row).join('')
    : '<div class="empty">这个会话没有消息</div>';
  $('#stream').scrollTop = $('#stream').scrollHeight;
  reloading = false;
}

function patch(msgId, status, detail, target){
  const el = document.querySelector(`[data-${target}="${CSS.escape(msgId)}"]`);
  if(el) el.innerHTML = chip(status, detail);
}

async function poll(){
  try{
    const {seq, events} = await get(`/api/events?since=${since}`);
    since = seq;
    let stale = false;
    for(const e of events){
      // 出站事件靠 reply_to 挂在被回复的那条上（relay 要发出去才有出站的身份）
      if(e.reply_to) patch(e.reply_to, e.status, e.detail, 'reply');
      if(e.msg_id) patch(e.msg_id, e.status, e.detail, 'own');
      if(e.chat_id === current && (e.status==='received' || e.status==='phone')) stale = true;
    }
    if(stale && !reloading) loadMessages();
    $('#seq').textContent = '事件 #' + seq;
    if(selected) showPanel();          // 抽屉开着就跟着最新状态走
  }catch(err){ $('#relay').textContent = '管理后台断开'; }
}

async function state(){
  const s = await get('/api/state');
  $('#who').textContent = (s.nickname||s.wxid||'?') + ' · bot';
  $('#drybadge').style.display = s.dry_run ? 'inline' : 'none';
  $('#drybtn').classList.toggle('on', s.dry_run);
  const g = s.groups||{};
  $('#counts').textContent = Object.entries(g).map(([k,v]) => `${k} ${v}`).join(' · ');
}

async function health(){
  let h;
  try{ h = await get('/api/health'); }catch(e){ h = null; }
  if(!h){ $('#panel-health').innerHTML = '<div class="empty">健康检查失败</div>'; return; }
  const dot = $('#relaydot'), lbl = $('#relay');
  dot.className = 'dot ' + (h.relay.ok ? 'ok' : 'bad');
  lbl.textContent = h.relay.ok ? `${h.relay.nickname}（relay 正常）` : 'relay 取不到状态';
  const kv = o => Object.entries(o).map(([k,v]) => `<span>${esc(k)}</span><span>${esc(JSON.stringify(v))}</span>`).join('');
  $('#panel-health').innerHTML = `
    <h3>relay</h3><div class="kv">${kv(h.relay)}</div>
    <h3>专注会话（进 ${h.focus_counts.entered} / 出 ${h.focus_counts.exited}）</h3>
    <div class="kv">${h.focus.length ? h.focus.map(f =>
      `<span>${esc(f.chat)}</span><span>${f.rounds} 轮 · ${esc(f.reason)} · 空闲 ${Math.round(f.idle_left)}s / 上限 ${Math.round(f.max_left)}s</span>`).join('') : '<span>无</span><span></span>'}</div>
    <h3>沉默退避</h3><div class="kv">${kv(h.backoff)}</div>
    <h3>队列 / 窗口 / 库</h3><div class="kv">${kv({
      '待发队列': h.outbox, '模型可见条数': h.window,
      '表情（总/能发/有场景）': `${h.emojis.total}/${h.emojis.sendable}/${h.emojis.scene}`,
      '中期记忆条数': h.moments, '累计回复/表情/错别字': h.counters})}</div>`;
}

async function logs(){
  const {lines} = await get('/api/log?tail=300');
  $('#panel-log').innerHTML = '<div class="tabs"><button onclick="logs()">全部</button>'
    + '<button onclick="logsWarn()">只看 WARNING/ERROR</button></div>'
    + lines.map(l => {
        const cls = l.includes('| ERROR') ? 'err' : (l.includes('| WARNING') ? 'warn' : '');
        return `<div class="logline ${cls}">${esc(l)}</div>`;
      }).join('') || '<div class="empty">没有日志</div>';
}
async function logsWarn(){
  const {lines} = await get('/api/log?tail=300&only=WARNING,ERROR');
  $('#panel-log').innerHTML = lines.map(l =>
    `<div class="logline ${l.includes('| ERROR')?'err':'warn'}">${esc(l)}</div>`).join('')
    || '<div class="empty">没有警告</div>';
}

function pickedRow(){
  const el = selected && document.querySelector(`[data-id="${CSS.escape(selected)}"]`);
  return el ? el.querySelector('.body').textContent : '';
}

const TABS = ['trace','health','log','stats','assets','config'];

async function stats(){
  const hours = window.statsHours || 24;
  const s = await get('/api/stats?hours=' + hours);
  const pct = v => v == null ? '—' : (v*100).toFixed(1) + '%';
  const rows = Object.entries(s.counts).sort((a,b) => b[1]-a[1]);
  const total = rows.reduce((n, [,v]) => n + v, 0) || 1;
  $('#panel-stats').innerHTML = `
    <div class="tabs">
      <button onclick="setHours(1)" class="${hours===1?'on':''}">1 小时</button>
      <button onclick="setHours(24)" class="${hours===24?'on':''}">24 小时</button>
      <button onclick="setHours(168)" class="${hours===168?'on':''}">7 天</button>
    </div>
    <h3>比率</h3>
    <div class="kv">
      <span>门控放行率</span><span>${pct(s.rates.gate_pass)}</span>
      <span>planner 沉默率</span><span>${pct(s.rates.planner_silent)}</span>
      <span>回复率</span><span>${pct(s.rates.reply)}</span>
      <span>失败率</span><span>${pct(s.rates.failed)}</span>
    </div>
    <h3>被点名延迟（最近 ${s.latency.n} 轮）</h3>
    <div class="kv"><span>p50 / p95</span><span>${s.latency.p50 ?? '—'} / ${s.latency.p95 ?? '—'} ms</span></div>
    <h3>专注 / 累计</h3>
    <div class="kv">
      <span>专注进 / 出</span><span>${s.focus.entered} / ${s.focus.exited}</span>
      <span>回复·表情·错别字</span><span>${s.counters.reply} · ${s.counters.emoji} · ${s.counters.typo}</span>
    </div>
    <h3>token（进程内累计，重启归零）</h3>
    <div class="kv">
      <span>调用次数</span><span>${s.usage.calls}</span>
      <span>prompt / completion</span><span>${s.usage.prompt} / ${s.usage.completion}</span>
      <span>缓存命中 / 写入</span><span>${s.usage.cached} / ${s.usage.cache_write}（命中率 ${s.usage.cache_hit_rate == null ? '—' : (s.usage.cache_hit_rate*100).toFixed(1)+'%'}）</span>
    </div>
    <h3>状态分布（共 ${total} 条事件）</h3>
    ${rows.map(([k,v]) => `<div class="bar"><span>${esc(LABEL[k]||k)}</span>
      <i style="width:${Math.max(2, v/total*100)}%"></i><em>${v}</em></div>`).join('')
      || '<div class="detail">这段时间没有事件（看板是从启用后台开始计的）</div>'}`;
}
window.setHours = h => { window.statsHours = h; stats(); };

async function assets(){
  const [p, e, m] = await Promise.all([get('/api/prompts'), get('/api/emojis'), get('/api/moments')]);
  const prompts = Object.entries(p).map(([name, text]) => `
    <div style="margin-bottom:10px">
      <div class="detail">${name}.txt <button onclick="savePrompt('${name}')">保存并热重载</button></div>
      <textarea id="prompt-${name}">${esc(text)}</textarea>
    </div>`).join('');
  const emojis = e.emojis.map(x => `<div class="bar">
      <span title="${esc(x.md5)}">${esc(x.desc || '(无标签)')}${x.sendable ? '' : ' ⛔'}</span>
      <em style="flex:1">${esc(x.scene || '（没写场景）')}</em><em>${x.count}</em>
      <button onclick="delEmoji('${x.md5}')">删</button></div>`).join('')
    || '<div class="detail">空库</div>';
  const moments = m.moments.map(x => `<div class="mem">
      <div class="detail">${esc(x.chat)} · ${new Date(x.t_start*1000).toLocaleString('zh-CN')}
        <button style="float:right" onclick="delMoment(${x.id})">删</button></div>
      <div>${esc(x.summary)}</div></div>`).join('')
    || '<div class="detail">还没有记忆（消息滑出窗口 100 条才压一批）</div>';
  $('#panel-assets').innerHTML = `
    <h3>提示词（保存即热重载）</h3>${prompts}
    <h3>表情库（${e.emojis.length} 张；⛔ = 缺下载地址发不出去）</h3>${emojis}
    <h3>记忆（${m.moments.length} 条）</h3>${moments}`;
}

window.savePrompt = async name => {
  const r = await post('/api/prompts', {name, text: document.querySelector('#prompt-'+name).value});
  alert(r.error ? ('保存失败：' + r.error)
                : `已保存 ${r.saved}（${r.lines} 行）并热重载`);
};
window.delEmoji = async md5 => {
  if(!confirm('删掉这张表情？场景描述是花钱识图来的，删了不再补。')) return;
  await post('/api/emoji_delete', {md5}); assets();
};
window.delMoment = async id => {
  if(!confirm('删掉这条记忆？')) return;
  await post('/api/moment_delete', {id}); assets();
};
window.replay = async (msgId, stage) => {
  const box = $('#replay-out');
  box.textContent = '重放中（会真的调模型）…';
  const r = await post('/api/replay/' + encodeURIComponent(msgId), {stage});
  box.textContent = r.error ? ('失败：' + r.error)
    : `决策：${r.plan || '（不发言）'}\n\n表达（${r.latency_ms} ms）：\n${(r.reply || []).join('\n')}`;
};

function cfgInput(item){
  const label = esc(item.name) + (item.hot ? '' : ' ⚠');
  if(item.type === 'bool')
    return `<label class="cfg-row"><span>${label}</span>
      <input type="checkbox" data-name="${item.name}" ${item.value ? 'checked' : ''}></label>`;
  const val = item.secret ? '' : esc(item.value);
  const ph = item.secret ? (item.isset ? '已设置（留空不变）' : '未设置') : '';
  const type = item.secret ? 'password' : (item.type === 'str' ? 'text' : 'number');
  const step = item.type === 'int' ? '1' : 'any';
  const long = ['personality','reply_style','behavior_style','reply_styles'].includes(item.name);
  const field = long
    ? `<textarea data-name="${item.name}" placeholder="${ph}">${val}</textarea>`
    : `<input type="${type}" step="${step}" data-name="${item.name}" value="${val}" placeholder="${ph}">`;
  return `<label class="cfg-row" ${long ? 'style="align-items:flex-start"' : ''}><span>${label}</span>${field}</label>`;
}

async function config(){
  const d = await get('/api/config');
  $('#panel-config').innerHTML = d.groups.map(g =>
      `<h3>${esc(g.group)}</h3><div class="cfg">${g.items.map(cfgInput).join('')}</div>`).join('')
    + `<div class="cfg-actions">
         <button onclick="saveConfig(false,false)">保存</button>
         <button onclick="saveConfig(true,false)">保存并热重载</button>
         <button onclick="saveConfig(true,true)">保存并重启进程</button>
       </div>
       <div class="detail" id="cfgmsg" style="margin-top:8px">带 �️ 的字段要重启进程才生效；清空一个框 = 回默认值。</div>`;
}

async function saveConfig(reload, restart){
  const msg = t => { $('#cfgmsg').innerHTML = t; };
  const updates = {};
  document.querySelectorAll('#panel-config [data-name]').forEach(el => {
    updates[el.dataset.name] = el.type === 'checkbox' ? el.checked : el.value;
  });
  const r = await post('/api/config', {updates});
  if(r.error) return msg('保存失败：' + esc(r.error));
  const changed = Object.entries(r.changed || {});
  let text = changed.length ? '已写回 .env：' + changed.map(([k,v]) => `${k}=${esc(v)}`).join('，')
                            : '没有改动';
  if(r.stale.length) text += `<br>⚠ 要重启进程才生效：${esc(r.stale.join('，'))}`;
  msg(text);
  if(restart){ msg(text + '<br>正在重启进程…'); await post('/api/restart', {}); return; }
  if(reload){
    const g = await post('/api/reload', {});
    if(g.error) return msg(text + '<br>热重载失败：' + esc(g.error));
    msg(text + `<br>已热重载；生效的改动：${esc(JSON.stringify(g.changed))}`);
    state();
  }
}

async function showPanel(){
  if(!tab) return;
  for(const t of TABS) $('#panel-'+t).style.display = t===tab ? '' : 'none';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  if(tab==='trace'){
    if(!selected){ $('#panel-trace').innerHTML = '<div class="empty">点一条消息看它为什么被跳过</div>'; return; }
    const d = await get('/api/trace/' + encodeURIComponent(selected));
    const ev = d.event, tr = d.trace;
    let html = `<h3>这条消息</h3>
      <div class="kv"><span>内容</span><span>${esc(pickedRow())}</span>
      <span>msg_id</span><span>${esc(d.msg_id)}</span>
      <span>自己的状态</span><span>${ev ? chip(ev.status, ev.detail) : '（没有埋点）'}</span>
      <span>回复进度</span><span>${d.reply ? chip(d.reply.status, d.reply.detail) : '—'}</span></div>`;
    if(!tr){
      html += `<h3>模型轮次</h3><div class="detail">没有 trace——门控就拦下了，没走到模型</div>`;
    }else{
      html += `<h3>模型轮次</h3><div class="kv">
        <span>触发</span><span>${esc(tr.trigger)} · 分数 ${tr.score} · ${esc((tr.reasons||[]).join('+'))}</span>
        <span>延迟</span><span>${tr.latency_ms} ms</span>
        <span>回复</span><span>${esc((tr.reply||[]).join(' / ')) || '（不发言）'}</span></div>
        <h3>决策</h3><pre>${esc(tr.plan) || '（无）'}</pre>
        <h3>当时看到的聊天记录</h3><pre>${esc(tr.transcript)}</pre>
        <h3>重放</h3>
        <div class="detail">用当前提示词重跑这一轮：不碰历史、不进队列、也不发送，但会真的花 token。
          上下文只能用当时存下的聊天记录（画像/群用语/记忆没留痕），决策那一步走单轮 JSON 模式。
          比表达风格可靠，比决策质量不可靠。</div>
        <div style="margin:6px 0">
          <button onclick="replay('${d.msg_id}', 'all')">重放两步</button>
          <button onclick="replay('${d.msg_id}', 'expressor')">只重放表达</button>
        </div>
        <pre id="replay-out"></pre>`;
    }
    $('#panel-trace').innerHTML = html;
  } else if(tab==='health') await health();
  else if(tab==='log') await logs();
  else if(tab==='stats') await stats();
  else if(tab==='assets') await assets();
  else if(tab==='config') await config();
}

$('#drybtn').onclick = async () => {
  const on = !$('#drybtn').classList.contains('on');
  await post('/api/dry_run', {on});
  state();
};
$('#mutebtn').onclick = async () => {
  const r = await post('/api/mute', {chat: currentName, on: !$('#mutebtn').classList.contains('on')});
  $('#mutebtn').classList.toggle('on', r.muted); loadChats();
};
$('#focusbtn').onclick = async () => {
  const r = await post('/api/focus', {chat: currentName, on: !$('#focusbtn').classList.contains('on')});
  $('#focusbtn').classList.toggle('on', r.focus.includes(currentName)); loadChats();
};
$('#sendbtn').onclick = async () => {
  const text = $('#say').value.trim(); if(!text) return;
  const r = await post('/api/send', {chat: current, text});
  $('#say').value = '';
  $('#say').placeholder = r.error ? ('失败：' + r.error) : '已排队（走限速）';
};
$('#drawerbtn').onclick = () => $('#drawer').classList.toggle('hide');
$('#drawerclose').onclick = () => $('#drawer').classList.add('hide');
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; showPanel(); });
window.pick = id => { selected = id; showPanel();
  document.querySelectorAll('.bubble').forEach(b => b.classList.remove('sel'));
  const el = document.querySelector(`[data-id="${CSS.escape(id)}"] .bubble`); if(el) el.classList.add('sel'); };

(async function(){
  await state(); await loadChats(); await health();
  setInterval(poll, 1000);
  setInterval(state, 5000);
  setInterval(() => { if(!$('#drawer').classList.contains('hide') && tab==='health') health(); }, 5000);
})();
</script>
</body>
